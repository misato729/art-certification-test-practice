app = "art-history-practice"
primary_region = "nrt"

[build]
build-target = "production"
dockerfile = "Dockerfile"

[deploy]
release_command = "sh -c 'DATABASE_URL=\"$DIRECT_DATABASE_URL\" npm run db:migrate'"
release_command_timeout = "15m0s"

[env]
APP_ENV = "production"
BETTER_AUTH_URL = "https://art-history-practice.netlify.app"
CORS_ORIGINS = "https://art-history-practice.netlify.app"
FRONTEND_URL = "https://art-history-practice.netlify.app"
NITRO_HOST = "0.0.0.0"
NITRO_PORT = "3000"
NODE_ENV = "production"
NODE_OPTIONS = "--max-old-space-size=512"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 3000
min_machines_running = 0

[[http_service.checks]]
grace_period = "20s"
interval = "30s"
method = "GET"
path = "/api/v1/health"
timeout = "5s"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "1gb"
