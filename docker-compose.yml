name: ${COMPOSE_PROJECT_NAME:-art-certification-test-practice}

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    env_file: .env
    environment:
      DB_HOST: db
      PGPORT: 5432
      DB_NAME: ${DB_NAME:-art_practice_development}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3400}:3000"
      # Compatibility alias for callers using the previous Rails API port.
      - "127.0.0.1:${API_PORT:-3401}:3000"
    volumes:
      - ./frontend:/workspace/frontend
      - ./config:/workspace/config:ro
      - ./content:/workspace/content:ro
      - ./scripts:/workspace/scripts:ro
      - frontend_node_modules:/workspace/frontend/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 18

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-art_practice_development}
      POSTGRES_USER: ${POSTGRES_USER:-art_practice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a development database password in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-55435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  frontend_node_modules:
  postgres_data:
